[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerproof-backend"
version = "0.1.0"
description = "CareerProof AI recruitment evidence backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.43",
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "pgvector==0.4.1",
  "PyJWT==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "python-multipart==0.0.20",
  "email-validator==2.2.0",
  "httpx==0.28.1",
  "PyMuPDF==1.26.4",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
