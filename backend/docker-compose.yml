services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: careerproof
      POSTGRES_USER: careerproof
      POSTGRES_PASSWORD: careerproof
    ports:
      - "5432:5432"
    volumes:
      - careerproof_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerproof -d careerproof"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  careerproof_postgres:

