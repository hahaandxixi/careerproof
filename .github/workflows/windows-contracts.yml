name: Windows offline contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher-and-paths:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 launcher substitutes (no real services)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/v1-accepted-build.test.ps1
          & ./scripts/v1-profile-contract.test.ps1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned backend test dependencies on disposable runner
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Native filesystem target identity and draft coordinate contracts
        working-directory: backend
        env:
          APP_ENV: test
          AI_PROVIDER: mock
          AI_EXTERNAL_ENABLED: 'false'
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
        run: python -m pytest app/tests/test_archive_target_identity.py app/tests/test_job_draft_coordinates.py --basetemp=.tmp-ci-contracts -v
